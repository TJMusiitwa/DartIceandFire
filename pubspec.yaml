name: dart_ice_and_fire
description: A new Flutter project.

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 3.2.0

environment:
  sdk: '>=3.13.7 <4.0.0'

dependencies:
  cupertino_icons: ^2.0.0
  dio: ^5.11.1
  dio_cache_interceptor: ^4.0.7
  flex_color_scheme: ^9.0.0
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  get_it: ^9.0.5
  material_ui: ^1.9.0
  search_page: ^2.3.0
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.8
  flutter_test:
    sdk: flutter

flutter_icons:
  android: true
  ios: true
  image_path: "assets/icon.png"
  remove_alpha_ios: false
  min_sdk_android: 22
  web:
    generate: false
  windows:
    generate: false

flutter_native_splash:
  color: "#162845"
  image: assets/icon.png
  android: true
  ios: true

flutter:

  uses-material-design: true
